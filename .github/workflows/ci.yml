name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: |
          xcodebuild build \
            -project qw/qw.xcodeproj \
            -scheme qw \
            -destination 'platform=macOS'

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project qw/qw.xcodeproj \
            -scheme qw \
            -destination 'platform=macOS' \
            -only-testing:qwTests

      # UI tests (qwUITests) are skipped in CI because they require
      # screen access and are flaky on headless runners.
