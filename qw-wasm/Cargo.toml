[package]
name = "qw-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM hex viewer core - file type detection, hex formatting, and byte decoding"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
