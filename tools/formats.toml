# formats.toml — File format definitions for qw hex editor
#
# Each [[format]] entry defines a binary file signature with optional
# sections and fields.  Grouped by category for readability.
#
# Categories: image, video, audio, document, proprietary
#
# Ticket: T-000040

# ─── Image ───────────────────────────────────────────────────────────

[[format]]
id = 1
name = "PNG Image"
description = "Portable Network Graphics image"
category = "image"
magic_bytes = [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]
offset = 0
priority = 10

[[format.sections]]
name = "PNG Signature"
kind = "signature"
description = "8-byte PNG file signature (\\x89PNG\\r\\n\\x1a\\n)"
offset_expr = "0"
length_expr = "8"

[[format.sections]]
name = "IHDR"
kind = "header"
description = "Image header: width, height, bit depth, color type"
offset_expr = "8"
length_expr = "25"

[[format.fields]]
section_name = "PNG Signature"
name = "PNG Signature"
offset = 0
size = 8
type = "magic"
endianness = "big"
display_format = "hex"

[[format.fields]]
section_name = "IHDR"
name = "IHDR Length"
offset = 8
size = 4
type = "uint32"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "IHDR"
name = "IHDR Chunk Type"
offset = 12
size = 4
type = "ascii"
endianness = "big"
display_format = "string"

[[format.fields]]
section_name = "IHDR"
name = "Width"
offset = 16
size = 4
type = "uint32"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "IHDR"
name = "Height"
offset = 20
size = 4
type = "uint32"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "IHDR"
name = "Bit Depth"
offset = 24
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "IHDR"
name = "Color Type"
offset = 25
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "0" = "Grayscale", "2" = "RGB", "3" = "Indexed", "4" = "Grayscale+Alpha", "6" = "RGBA" }

[[format.fields]]
section_name = "IHDR"
name = "Compression"
offset = 26
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "0" = "Deflate" }

[[format.fields]]
section_name = "IHDR"
name = "Filter"
offset = 27
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "0" = "Adaptive" }

[[format.fields]]
section_name = "IHDR"
name = "Interlace"
offset = 28
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "0" = "None", "1" = "Adam7" }


[[format]]
id = 2
name = "JPEG Image"
description = "JPEG/JFIF image"
category = "image"
magic_bytes = [0xFF, 0xD8, 0xFF]
offset = 0
priority = 10

[[format.sections]]
name = "SOI"
kind = "signature"
description = "Start of Image marker (FF D8)"
offset_expr = "0"
length_expr = "2"

[[format.fields]]
section_name = "SOI"
name = "SOI Marker"
offset = 0
size = 2
type = "magic"
endianness = "big"
display_format = "hex"

[[format.fields]]
section_name = "APP0"
name = "APP0 Marker"
offset = 2
size = 2
type = "magic"
endianness = "big"
display_format = "hex"

[[format.fields]]
section_name = "APP0"
name = "APP0 Length"
offset = 4
size = 2
type = "uint16"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "APP0"
name = "Identifier"
offset = 6
size = 5
type = "ascii"
endianness = "big"
display_format = "string"

[[format.fields]]
section_name = "APP0"
name = "Version Major"
offset = 11
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "APP0"
name = "Version Minor"
offset = 12
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "APP0"
name = "Density Units"
offset = 13
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "0" = "No units (aspect ratio)", "1" = "Pixels/inch", "2" = "Pixels/cm" }

[[format.fields]]
section_name = "APP0"
name = "X Density"
offset = 14
size = 2
type = "uint16"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "APP0"
name = "Y Density"
offset = 16
size = 2
type = "uint16"
endianness = "big"
display_format = "decimal"


