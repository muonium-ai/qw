category = "proprietary"
magic_bytes = [0x7F, 0x45, 0x4C, 0x46]
offset = 0
priority = 10

[[format.sections]]
name = "ELF Header"
kind = "header"
description = "ELF 64-bit header"
offset_expr = "0"
length_expr = "64"

[[format.fields]]
section_name = "ELF Header"
name = "ELF Magic"
offset = 0
size = 4
type = "magic"
endianness = "big"
display_format = "hex"

[[format.fields]]
section_name = "ELF Header"
name = "Class"
offset = 4
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "1" = "32-bit", "2" = "64-bit" }

[[format.fields]]
section_name = "ELF Header"
name = "Data Encoding"
offset = 5
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "1" = "Little-endian", "2" = "Big-endian" }

[[format.fields]]
section_name = "ELF Header"
name = "ELF Version"
offset = 6
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "ELF Header"
name = "OS/ABI"
offset = 7
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"
value_map = { "0" = "System V", "1" = "HP-UX", "2" = "NetBSD", "3" = "Linux", "6" = "Solaris", "9" = "FreeBSD", "12" = "OpenBSD" }

[[format.fields]]
section_name = "ELF Header"
name = "ABI Version"
offset = 8
size = 1
type = "uint8"
endianness = "big"
display_format = "decimal"

[[format.fields]]
section_name = "ELF Header"
name = "Padding"
offset = 9
size = 7
type = "bytes"
endianness = "big"
display_format = "hex"

[[format.fields]]
section_name = "ELF Header"
name = "Type"
offset = 16
size = 2
type = "uint16"
endianness = "little"
display_format = "decimal"
value_map = { "0" = "None", "1" = "Relocatable", "2" = "Executable", "3" = "Shared object", "4" = "Core" }

[[format.fields]]
section_name = "ELF Header"
name = "Machine"
offset = 18
size = 2
type = "uint16"
endianness = "little"
display_format = "decimal"
value_map = { "3" = "x86", "8" = "MIPS", "20" = "PowerPC", "40" = "ARM", "62" = "x86-64", "183" = "AArch64", "243" = "RISC-V" }


